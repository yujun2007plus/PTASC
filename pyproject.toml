[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ptasc"
version = "0.1.0"
description = "Convert an image or a video into ASCII art"
requires-python = ">=3.10"
dependencies = ["pillow>=9", "opencv-python-headless>=4.9", "imageio-ffmpeg>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
